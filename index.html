<style>
:root{
  color-scheme:light;
  --page:#f4f4f1; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --base:#c3c2b7; --border:rgba(11,11,11,.10); --soft:#f0efec;
  --brand:#1b3552; --brand-ink:#ffffff; --gold:#b98f3f;
  --side-bg:#1b3552; --side-ink:#dfe6ee; --side-active:rgba(255,255,255,.14);
  --s1:#2a78d6; --s2:#eb6834; --good:#006300; --bad:#c0322f; --field:#ffffff;
  --shadow:0 1px 2px rgba(11,11,11,.06);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --base:#383835; --border:rgba(255,255,255,.10); --soft:#242423;
    --brand:#d9b872; --brand-ink:#1a1a19; --gold:#d9b872;
    --side-bg:#141413; --side-ink:#c3c2b7; --side-active:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --good:#0ca30c; --bad:#e66767; --field:#242423;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --base:#383835; --border:rgba(255,255,255,.10); --soft:#242423;
  --brand:#d9b872; --brand-ink:#1a1a19; --gold:#d9b872;
  --side-bg:#141413; --side-ink:#c3c2b7; --side-active:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --good:#0ca30c; --bad:#e66767; --field:#242423;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 18px}
.brand b{display:block;font-size:12px;letter-spacing:.14em;color:#c8a35a;text-transform:uppercase}
.brand span{display:block;font-size:17px;font-weight:650;color:#fff;margin-top:2px}
:root[data-theme="dark"] .brand span{color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-size:14.5px}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--ink)}
.nav button:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav svg,.tabbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:12px;padding:10px;color:var(--side-ink);opacity:.8}
main{padding:22px 28px 60px;max-width:1180px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.ttlrow{display:flex;align-items:center;gap:10px;min-width:0}
#helpbtn{font-size:16px;font-weight:700;flex:none;color:var(--ink2)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:st}
.steps li{position:relative;padding-left:40px;counter-increment:st;font-size:14.5px}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps li b{display:block;font-size:15px;margin-bottom:2px}
.steps li span{color:var(--ink2)}
.guide-note{font-size:12.5px;color:var(--ink2);margin:16px 0 0}
.monthbar{display:flex;align-items:center;gap:6px}
.monthbar input[type=month]{min-width:150px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:14px;line-height:1.2}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--soft)}
input,select,textarea{background:var(--field);border:1px solid var(--base);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--brand)}
textarea{min-height:88px;resize:vertical}
.monthbar input,.inline input,.inline select{width:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:650;margin-bottom:2px}
.card .sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile .lbl{color:var(--ink2);font-size:13px}
.tile .val{font-size:26px;font-weight:650;margin-top:2px}
.tile .note{color:var(--ink2);font-size:12.5px;margin-top:2px}
.hero .lbl{color:var(--ink2);font-size:13px}
.hero .big{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.eq{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.eq td{padding:6px 0;border-top:1px solid var(--grid)}
.eq td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.eq tr.tot td{font-weight:650}
.eq tr.mute td{color:var(--ink2)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{position:relative;padding-left:16px;font-size:14.5px}
.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--base);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:650;border-bottom:0;border-top:1px solid var(--base)}
table.t td.actions{white-space:nowrap;text-align:right}
table.t td.actions .btn{margin-left:4px}
.sec{color:var(--ink2);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.paid{color:var(--good)} .badge.overdue{color:var(--bad)} .badge.open{color:var(--ink2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 180px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--base);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.chip.cat{display:inline-flex;align-items:center;gap:6px;cursor:default}
.chip.cat button{all:unset;cursor:pointer;color:var(--ink2);padding:0 2px}
.empty{padding:26px 10px;text-align:center;color:var(--ink2)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:0 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chartbox svg{display:block;max-width:100%;overflow:visible}
.chartbox .grid,.chartbox .axis{stroke-width:1}
.chartbox line.grid{stroke:var(--grid)} .chartbox line.axis{stroke:var(--base)}
.chartbox text{fill:var(--muted);font-size:11px}
.chartbox text.xl{fill:var(--ink2);font-size:12px} .chartbox text.selx{font-weight:700;fill:var(--ink)}
.chartbox .bar{transition:opacity .12s}
.chartbox.hovering .grp:not(.active) .bar{opacity:.4}
.chartbox .hit{outline:none} .chartbox .hit:focus-visible{stroke:var(--gold);stroke-width:2}
.cats{display:grid;gap:10px}
.cat-row{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.cat-row .track{height:16px}
.cat-row .fill{height:16px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.cat-row .v{font-variant-numeric:tabular-nums;text-align:right;min-width:88px}
.cat-row .v small{color:var(--ink2);margin-left:4px}
.form{display:grid;gap:12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px}
.field .lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--ink2)}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check label{cursor:pointer}
.progress{height:8px;background:var(--grid);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--s1)}
dialog{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog.wide{width:min(680px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--grid)}
.dlg-head h2{font-size:17px}
.dlg-body{padding:16px 18px;overflow:auto;max-height:calc(100vh - 170px)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--grid)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--base);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
#tip{position:fixed;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--base);border-radius:8px;padding:8px 10px;font-size:13px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18);min-width:150px}
#tip[hidden]{display:none}
#tip .tt{font-weight:600;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px;line-height:1.7}
#tip .key{width:12px;height:3px;border-radius:2px;flex:none}
#tip .tv{font-weight:650;font-variant-numeric:tabular-nums}
#tip .tl{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.tabbar{display:none}
.hide-sm{}
.show-sm{display:none}
.monthbar .btn{white-space:nowrap}
.vatsum{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:pre-wrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
table.sk th:first-child,table.sk td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
table.sk th:last-child,table.sk td:last-child{position:sticky;right:0;z-index:1;background:var(--surface);box-shadow:-1px 0 0 var(--grid)}
table.pl tr.tot td{font-weight:650;border-top:1px solid var(--base)}
table.pl tr.sub td{font-weight:600}
table.pl tr.grp td{color:var(--ink2);font-size:12.5px;font-weight:600;padding-top:14px;border-bottom:0}
table.pl tr.ind td:first-child{padding-left:22px}
table.pl tr.mute td{color:var(--ink2)}
table.pl td:first-child{min-width:150px}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:1000px){.g-hero,.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:16px 16px 96px}
  .top h1{font-size:21px}
  .hero .big{font-size:44px}
  .hide-sm{display:none}
  .show-sm{display:block}
  .hide-xs{display:none!important}
  .monthbar{width:100%}
  .monthbar input[type=month]{flex:1;min-width:0;padding-inline:8px;font-size:14px}
  table.t.stack,.stack thead,.stack tbody,.stack tfoot,.stack tr,.stack td{display:block}
  .stack thead{display:none}
  .stack tr{padding:10px 0;border-bottom:1px solid var(--grid)}
  .stack tfoot tr{border-bottom:0}
  .stack td{border:0!important;padding:2px 0!important;text-align:left!important}
  .stack td.num{font-weight:650;font-size:15px}
  .stack td.actions{padding-top:8px!important}
  .stack td.actions .btn{margin:0 6px 6px 0}
  table.t{font-size:13px}
  table.pl td:first-child{min-width:104px;max-width:120px}
  table.sk th,table.sk td{padding:8px 5px}
  table.t th,table.t td{padding:8px 6px}
  table.t td.actions{white-space:normal}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(46px,1fr);overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{all:unset;box-sizing:border-box;display:grid;justify-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--ink2);padding:4px 0;cursor:pointer;border-radius:8px}
  .tabbar button[aria-current="page"]{color:var(--ink);font-weight:650}
  .tabbar button[aria-current="page"] svg{stroke:var(--gold)}
  .form .row2{grid-template-columns:1fr}
  #toast{bottom:84px}
}
@media (max-width:420px){ .tiles{grid-template-columns:minmax(0,1fr)} }
@media (max-width:350px){ .monthbar{flex-wrap:wrap} .monthbar input[type=month]{min-width:150px} }
@media print{
  .side,.tabbar,.no-print,.monthbar,#banner,#toast,#tip{display:none!important}
  .app{display:block} body{background:#fff;color:#000} main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}
/* ---------- v7 additions ---------- */
:root{--link:#1f5fb0;--focus:#1f5fb0}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--link:#7db2f2;--focus:#8bb8f5}}
:root[data-theme="dark"]{--link:#7db2f2;--focus:#8bb8f5}
a{color:var(--link)}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;z-index:100;text-decoration:none;font-weight:600}
.skip:focus{left:8px}
main:focus{outline:none}
.nav button:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible,.tabbar button:focus-visible,summary:focus-visible,.age button.row:focus-visible,.cat button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.side :focus-visible{outline-color:#fff!important}
.chartbox text{fill:var(--ink2)}
.side{overflow-y:auto}
.side .foot{font-size:12px;line-height:1.45;display:grid;gap:6px}
.side .foot .priv b{color:#fff;font-weight:650}
:root[data-theme="dark"] .side .foot .priv b{color:var(--ink)}
.side .foot .bk{opacity:.95}
.side .foot .lic{opacity:.75;font-size:11.5px}
.banner.info{border-color:color-mix(in srgb,var(--s1) 45%,transparent)}
.banner .btns{display:flex;flex-wrap:wrap;gap:8px}
.snap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.pcard{display:flex;flex-direction:column}
.pcard .big2{font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:2px 0 2px;font-variant-numeric:tabular-nums}
.pcard .big2.neg{color:var(--bad)}
.tag{display:inline-block;align-self:flex-start;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--base);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.eq td:first-child{padding-right:12px}
details.explain{margin-top:auto;padding-top:12px;font-size:13px}
.pcard .eq{margin-bottom:0}
details.explain summary{cursor:pointer;color:var(--link);font-weight:600;width:max-content;max-width:100%;border-radius:6px}

<script>
"use strict";

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null) continue;
    if (k.startsWith('aria-') && typeof v === 'boolean'){ el.setAttribute(k, String(v)); continue; }
    if (v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden' || k === 'required') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));

  return el;
}
function hs(tag, props, ...kids){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (props) for (const [k, v] of Object.entries(props)) if (v != null) el.setAttribute(k, v);
  for (const kid of kids) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const sum = (arr, f) => round2(arr.reduce((a, x) => a + f(x), 0));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
function monthEnd(key){ const [y, m] = key.split('-').map(Number); return key + '-' + pad(new Date(y, m, 0).getDate()); }
function monthAdd(key, n){ const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthLabel(key, short){ const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-GB', short ? { month: 'short' } : { month: 'long', year: 'numeric' }); }
function dateLabel(iso){ return iso ? parseISO(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
const validISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(parseISO(s));

const CUR = { USD: { loc: 'en-US', sym: '$', name: 'US dollar ($)' }, EUR: { loc: 'nl-NL', sym: '€', name: 'Euro (€)' }, GBP: { loc: 'en-GB', sym: '£', name: 'British pound (£)' } };
const fmtCache = {};
function fmt(n, decimals){
  const c = state.settings.currency in CUR ? state.settings.currency : 'USD';
  const v = round2(n || 0);
  const frac = decimals != null ? decimals : (Number.isInteger(v) ? 0 : 2);
  const k = c + frac;
  if (!fmtCache[k]) fmtCache[k] = new Intl.NumberFormat(CUR[c].loc, { style: 'currency', currency: c, minimumFractionDigits: frac, maximumFractionDigits: frac });
  return fmtCache[k].format(v);
}
function cfmt(n){
  const c = state.settings.currency in CUR ? state.settings.currency : 'USD';
  return CUR[c].sym + new Intl.NumberFormat(CUR[c].loc, { notation: 'compact', maximumFractionDigits: 1 }).format(n);
}


/* ---------- data ---------- */
const KEY = 'bps-freelancer-bookkeeping-v1';
const KEY_UNDO = 'bps-freelancer-bookkeeping-undo-v1';
const APP_VERSION = 4;
const DEFAULT_CATS = ['Software', 'Marketing', 'Equipment', 'Office', 'Travel', 'Professional services', 'Education', 'Bank fees', 'Communication', 'Cost of sales', 'Other'];
/* Quick-add VAT/GST rates. They are only ever applied when the user presses the button for that country; nothing is assumed from the currency. */
const VAT_QUICK = [['Netherlands', [21, 9]], ['United Kingdom', [20, 5]], ['Germany', [19, 7]]];
const FREQ = { weekly: 'Every week', monthly: 'Every month', quarterly: 'Every 3 months', yearly: 'Every year' };
const PAY_METHODS = [['', 'Not specified'], ['bank', 'Bank transfer'], ['card', 'Card'], ['cash', 'Cash'], ['online', 'PayPal or online wallet'], ['other', 'Other']];
const payLabel = v => (PAY_METHODS.find(p => p[0] === v) || PAY_METHODS[0])[1];
/* Money that moves through the bank without being an invoice or an expense. `group` says where it lands on the balance sheet:
   owner -> equity, vat and loan -> liabilities. `sign` is the effect on cash. None of these are revenue or business expenses. */
const TR = {
  'owner-draw': { label: 'Owner draw', hint: 'Money you take out of the business for yourself. It is not a business expense.', sign: -1, group: 'owner' },
  'owner-in': { label: 'Owner contribution', hint: 'Money you put into the business account from your own pocket. It is not revenue.', sign: 1, group: 'owner' },
  'tax-paid': { label: 'Income tax payment', hint: 'Income tax you pay from the business account. It lowers your cash and your planning reserve, not your profit.', sign: -1, group: 'owner' },
  'vat-paid': { label: 'VAT/GST payment to the tax authority', hint: 'Reduces the VAT/GST you owe.', sign: -1, group: 'vat' },
  'vat-refund': { label: 'VAT/GST refund received', hint: 'Money the tax authority paid back to you.', sign: 1, group: 'vat' },
  'loan-in': { label: 'Loan or credit received', hint: 'Adds to your cash and to what you owe.', sign: 1, group: 'loan' },
  'loan-out': { label: 'Loan repayment (principal)', hint: 'Reduces your cash and what you owe. Book interest as an expense.', sign: -1, group: 'loan' }
};
const tCash = t => (TR[t.type] ? TR[t.type].sign : 0) * (+t.amount || 0);
const TAB_IDS = ['dashboard', 'invoices', 'clients', 'expenses', 'cash', 'pl', 'balance', 'vat', 'review', 'reports', 'settings'];
function defaults(){
  const t = todayISO();
  return {
    v: APP_VERSION, demo: false, demoPrev: null,
    settings: { business: '', currency: 'USD', openingCash: 0, openingDate: t.slice(0, 8) + '01', reservePct: 25, reserveBasis: 'profit', theme: 'auto', categories: DEFAULT_CATS.slice(), termsDays: 14, onboarded: false, setupSeen: false, lastBackup: null,
      mode: 'simple', vatOn: false, vatBasis: 'invoice', vatRates: [0], defaultVat: 0, cogsCats: ['Cost of sales'], openingVat: 0 },
    invoices: [], expenses: [], transfers: [], balanceItems: [], clients: [], recInv: [], recExp: [], reviews: {},
    ui: { month: t.slice(0, 7), tab: 'dashboard', invScope: 'all', invFilter: 'all', invQuery: '', invSort: 'newest', invClient: '', invAge: '', expScope: 'month', expCat: 'all', expQuery: '', expSort: 'newest', cashScope: 'month', clientQuery: '', clientSort: 'name',
      repYear: +t.slice(0, 4), repTab: 'overview', vatPeriod: 'quarter', plPeriod: 'quarter', repQuarter: Math.ceil((+t.slice(5, 7)) / 3), bsDate: '' }
  };
}
function cleanVat(x){
  x.vat = round2(Math.max(0, +x.vat || 0));
  x.vatRate = Math.max(0, +x.vatRate || 0);
  return x;
}
const INV_STATUS = ['draft', 'sent', 'paid'];
function cleanInvoice(i){
  cleanVat(i);
  if (i.status === 'open') i.status = 'sent';
  if (!INV_STATUS.includes(i.status)) i.status = validISO(i.paidDate) ? 'paid' : 'sent';
  if (i.status === 'paid' && !validISO(i.paidDate)) i.paidDate = i.dueDate;
  if (i.status !== 'paid') i.paidDate = '';
  i.notes = String(i.notes || '').slice(0, 300);
  return i;
}
function cleanReceipt(r){
  if (r === true) return { kind: 'external' };
  if (r && typeof r === 'object'){
    if (r.kind === 'file' && r.id) return { kind: 'file', id: String(r.id), name: String(r.name || 'receipt').slice(0, 120), type: String(r.type || ''), size: +r.size || 0 };
    if (r.kind === 'external') return { kind: 'external' };
  }
  return null;
}
function normalize(s){
  const d = defaults();
  const out = Object.assign(d, s || {});
  out.v = APP_VERSION;
  out.demo = !!out.demo;
  out.demoPrev = out.demoPrev && typeof out.demoPrev === 'object' ? out.demoPrev : null;
  out.settings = Object.assign(d.settings, (s && s.settings) || {});
  out.ui = Object.assign(defaults().ui, (s && s.ui) || {});
  const st = out.settings;
  out.invoices = (Array.isArray(out.invoices) ? out.invoices : []).filter(i => i && validISO(i.issueDate) && validISO(i.dueDate) && isFinite(+i.amount) && +i.amount > 0)
    .map(i => cleanInvoice(Object.assign({}, i, { id: i.id || uid(), no: String(i.no || '').slice(0, 30), client: String(i.client || '').trim().slice(0, 80) || 'Unnamed client', desc: String(i.desc || '').slice(0, 120), amount: round2(+i.amount) })));
  out.expenses = (Array.isArray(out.expenses) ? out.expenses : []).filter(x => x && validISO(x.date) && isFinite(+x.amount) && +x.amount > 0)
    .map(x => { cleanVat(x); const paid = x.status === 'paid';
      return Object.assign({}, x, { id: x.id || uid(), vendor: String(x.vendor || '').slice(0, 80), desc: String(x.desc || '').slice(0, 120), amount: round2(+x.amount), status: paid ? 'paid' : 'open', paidDate: paid ? (validISO(x.paidDate) ? x.paidDate : x.date) : '', receipt: cleanReceipt(x.receipt), payMethod: PAY_METHODS.some(p => p[0] === x.payMethod) ? x.payMethod : '' }); });
  out.transfers = (Array.isArray(out.transfers) ? out.transfers : []).filter(t => t && TR[t.type] && validISO(t.date) && +t.amount > 0)
    .map(t => ({ id: t.id || uid(), date: t.date, type: t.type, amount: round2(+t.amount), note: String(t.note || '').slice(0, 120) }));
  out.balanceItems = (Array.isArray(out.balanceItems) ? out.balanceItems : []).filter(b => b && (b.kind === 'asset' || b.kind === 'liability') && validISO(b.date) && isFinite(+b.amount) && +b.amount >= 0)
    .map(b => ({ id: b.id || uid(), kind: b.kind, label: String(b.label || '').slice(0, 80), amount: round2(+b.amount), date: b.date }));
  const cleanRec = (r, isInv) => {
    const nd = validISO(r.nextDate) ? r.nextDate : todayISO();
    const o = { id: r.id || uid(), desc: String(r.desc || '').slice(0, 120), amount: round2(+r.amount), vat: round2(Math.max(0, +r.vat || 0)), vatRate: Math.max(0, +r.vatRate || 0),
      freq: FREQ[r.freq] ? r.freq : 'monthly', nextDate: nd, anchor: (+r.anchor >= 1 && +r.anchor <= 31) ? Math.round(+r.anchor) : +nd.slice(8), active: r.active !== false };
    if (isInv) o.client = String(r.client || '').trim().slice(0, 80) || 'Unnamed client';
    else { o.vendor = String(r.vendor || '').slice(0, 80); o.category = String(r.category || 'Other').slice(0, 60); o.payMethod = PAY_METHODS.some(p => p[0] === r.payMethod) ? r.payMethod : ''; }
    return o;
  };
  out.recInv = (Array.isArray(out.recInv) ? out.recInv : []).filter(r => r && +r.amount > 0).map(r => cleanRec(r, true));
  out.recExp = (Array.isArray(out.recExp) ? out.recExp : []).filter(r => r && +r.amount > 0).map(r => cleanRec(r, false));

function barPath(x, y, w, hgt, r){
  r = Math.min(r, hgt, w / 2);
  return 'M' + x + ' ' + (y + hgt) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + 'V' + (y + hgt) + 'Z';
}
function lastSix(key){
  const rows = [];
  for (let k = -5; k <= 0; k++){
    const mk = monthAdd(key, k), s = stats(mk);
    rows.push({ key: mk, label: monthLabel(mk, true), long: monthLabel(mk), received: s.received, expenses: s.expensesPaid });
  }
  return rows;
}
function drawBars(host, rows, selKey){
  host.textContent = '';
  const W = Math.max(280, Math.floor(host.clientWidth || 560)), H = 232, ml = 46, mr = 6, mt = 10, mb = 28;
  const pw = W - ml - mr, ph = H - mt - mb;
  const maxV = Math.max(0, ...rows.flatMap(r => [r.received, r.expenses]));
  const { max, step } = niceScale(maxV);
  const y = v => mt + ph - (v / max) * ph;
  const svg = hs('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', 'aria-label': 'Cash received and expenses paid over the last six months. A table view is available.' });
  for (let k = 0; k <= 4; k++){
    const v = step * k, yy = y(v);
    svg.append(hs('line', { x1: ml, x2: W - mr, y1: yy, y2: yy, class: k === 0 ? 'axis' : 'grid' }));
    svg.append(hs('text', { x: ml - 8, y: yy + 4, 'text-anchor': 'end' }, cfmt(v)));
  }
  const slot = pw / rows.length, bw = Math.max(8, Math.min(24, Math.floor((slot - 14) / 2))), gap = 2;
  rows.forEach((r, idx) => {
    const cx = ml + slot * idx + slot / 2;
    const g = hs('g', { class: 'grp' });
    for (const [val, col, x] of [[r.received, 'var(--s1)', cx - gap / 2 - bw], [r.expenses, 'var(--s2)', cx + gap / 2]]){
      const hh = (val / max) * ph;
      if (hh > 0.5) g.append(hs('path', { d: barPath(x, y(val), bw, hh, 4), fill: col, class: 'bar' }));
    }
    g.append(hs('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: 'xl' + (r.key === selKey ? ' selx' : '') }, r.label));
    const hit = hs('rect', { x: ml + slot * idx, y: mt, width: slot, height: ph + mb, fill: 'transparent', tabindex: 0, class: 'hit', role: 'img', 'aria-label': r.long + ': cash received ' + fmt(r.received) + ', expenses paid ' + fmt(r.expenses) });
    const on = () => {
      host.classList.add('hovering'); g.classList.add('active');
      showTip(hit.getBoundingClientRect(), r.long, [{ color: 'var(--s1)', label: 'Cash received', value: fmt(r.received) }, { color: 'var(--s2)', label: 'Expenses paid', value: fmt(r.expenses) }]);
    };
    const off = () => { host.classList.remove('hovering'); g.classList.remove('active'); hideTip(); };
    hit.addEventListener('pointerenter', on); hit.addEventListener('pointermove', on); hit.addEventListener('pointerleave', off);
    hit.addEventListener('focus', on); hit.addEventListener('blur', off);
    g.append(hit); svg.append(g);
  });
  host.append(svg);
}
function mountBars(host, rows, selKey){
  let last = 0;
  const draw = () => { last = host.clientWidth; drawBars(host, rows, selKey); };
  draw();
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (host.isConnected && host.clientWidth && Math.abs(host.clientWidth - last) > 6) draw(); }).observe(host);
}
function chartCard(title, sub, legend, buildChart, buildTable){
  let table = false;
  const body = h('div', { class: 'chartbox' });
  const btn = h('button', { class: 'btn sm ghost no-print', type: 'button', 'aria-pressed': 'false' }, 'Table view');
  const paint = () => {
    body.textContent = '';
    btn.textContent = table ? 'Chart view' : 'Table view'; btn.setAttribute('aria-pressed', table);
    if (table) body.append(buildTable()); else buildChart(body);
  };
  btn.addEventListener('click', () => { table = !table; paint(); });
  const card = h('div', { class: 'card' }, h('div', { class: 'chart-head' }, h('div', null, h('h2', null, title), h('p', { class: 'sub' }, sub)), btn), legend, body);
  setTimeout(paint, 0);

/* apply the answers of the setup flow, then either load the demo or open an empty business */
function applySetup(w){
  const keep = { theme: state.settings.theme, categories: state.settings.categories.slice(), cogsCats: state.settings.cogsCats.slice(), lastBackup: state.settings.lastBackup };
  state = defaults();
  Object.assign(state.settings, keep, { business: String(w.name || '').trim().slice(0, 60), currency: w.currency, mode: w.mode, reservePct: w.pct, setupSeen: true });
  if (w.start === 'demo'){ loadDemo(); return; }
  Object.assign(state.settings, { openingCash: w.cash, openingDate: w.date, onboarded: true });
  state.ui.month = todayISO().slice(0, 7);
  commit(); toast('Your business is ready. Add your first invoice or expense.'); purgeOrphans();
}

async function exportBackup(){
  const files = {}; let missing = 0;
  for (const x of state.expenses) if (x.receipt && x.receipt.kind === 'file'){
    try { const b = await RC.get(x.receipt.id); if (b) files[x.receipt.id] = { name: x.receipt.name, type: b.type || x.receipt.type, data: await blobToDataURL(b) }; else missing++; } catch (e) { missing++; }
  }
  const prev = state.settings.lastBackup;
  state.settings.lastBackup = todayISO();
  const data = JSON.stringify({ app: 'bps-freelancer-bookkeeping', version: APP_VERSION, exported: new Date().toISOString(), data: state, receipts: files });
  if (downloadFile('bookkeeping-backup-' + todayISO() + '.json', data, 'application/json')){ save(); render(); toast('Backup downloaded' + (missing ? '. ' + plural(missing, 'receipt file') + ' could not be included.' : '')); }
  else state.settings.lastBackup = prev;
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = async () => {
    let j, d;
    try { j = JSON.parse(rd.result); d = j && j.data ? j.data : j; } catch (e) { toast('That file could not be read. Choose a bookkeeping backup file (.json) exported from this app.'); return; }
    if (!d || typeof d !== 'object' || !Array.isArray(d.invoices) || !Array.isArray(d.expenses) || !d.settings || typeof d.settings !== 'object'){ toast('That file is not a backup from this app, so nothing was changed.'); return; }
    const n = normalize(d);
    const skipped = (d.invoices.length - n.invoices.length) + (d.expenses.length - n.expenses.length);
    const msg = 'Replace everything in the app with this backup? It contains ' + plural(n.invoices.length, 'invoice') + ', ' + plural(n.expenses.length, 'expense') + ', ' + plural(n.clients.length, 'client') + (j.exported ? ' and was exported on ' + dateLabel(j.exported.slice(0, 10)) : '') + '. Your current data is kept for one undo step in Settings.' + (skipped > 0 ? ' ' + (skipped === 1 ? '1 entry' : skipped + ' entries') + ' in the file could not be read and will be skipped.' : '') + ((+d.v || 0) > APP_VERSION ? ' This backup was made with a newer version of the app, so some details may not carry over.' : '');
    if (await confirmDlg(msg, 'Replace data')){
      stashUndo('restore');
      let failed = 0;
      for (const [id, f] of Object.entries((j && j.receipts) || {})) { try { await RC.put(id, dataURLToBlob(f.data)); } catch (e) { failed++; } }
      state = n; state.settings.setupSeen = true;
      commit(); toast('Backup restored' + (failed ? '. ' + plural(failed, 'receipt file') + ' could not be restored.' : ''));
    }
  };
  rd.onerror = () => toast('That file could not be read.');
  rd.readAsText(file);
}

/* ---------- app version, offline copy, install, updates ---------- */
const APP_VERSION_LABEL = '1.1.1', APP_BUILD = '1.1.1-ba51b4b7';
const PWA = { reg: null, waiting: null, canInstall: null, offlineReady: false, checked: 0, reloading: false };
const swSupported = !!navigator.serviceWorker && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
/* The service worker only stores the app files themselves (never your bookkeeping data, which lives in this browser's own storage).
   The app is always loaded from the network first, so you get the newest version whenever you are online; the stored copy is for offline use.
   A new version is never applied behind your back: you choose "Update now". */
function buildUpdate(){
  const el = document.getElementById('update'); if (!el) return;
  el.textContent = '';
  if (PWA.waiting) el.append(h('div', { class: 'update no-print', role: 'status' }, h('span', null, 'A new version of BasicProfitStudio is available.'), h('button', { class: 'btn sm', type: 'button', onclick: applyUpdate }, 'Update now')));
}
function applyUpdate(){
  if (!PWA.waiting) return;
  if (dlg.open){ toast('Finish or close the open form first, then choose Update now. Your data is not affected.'); return; }
  save(); PWA.reloading = true; PWA.waiting.postMessage({ type: 'SKIP_WAITING' });
  setTimeout(() => { if (PWA.reloading) location.reload(); }, 4000);
}
function showUpdate(worker){ PWA.waiting = worker; buildUpdate(); if (state.ui.tab === 'settings') render(); }
/* If the page you are looking at already is the newest build (it was loaded from the network), there is nothing to ask: the stored copy just catches up. */
function offerUpdate(worker){
  let answered = false;
  try {
    const ch = new MessageChannel();
    ch.port1.onmessage = e => { answered = true; if (e.data && e.data.version === APP_BUILD) worker.postMessage({ type: 'SKIP_WAITING' }); else showUpdate(worker); };
    worker.postMessage({ type: 'GET_VERSION' }, [ch.port2]);
  } catch (e) { showUpdate(worker); return; }
  setTimeout(() => { if (!answered) showUpdate(worker); }, 1500);
}
async function checkForUpdates(manual){
  if (!PWA.reg){ if (manual) toast(swSupported ? 'The offline copy is not ready yet. Try again in a moment.' : 'Updates apply when you open the app from its web address.'); return; }
  PWA.checked = Date.now();
  try { await PWA.reg.update(); } catch (e) { if (manual) toast('Could not check for updates. Are you online?'); return; }
  if (manual) setTimeout(() => { if (!PWA.waiting) toast('You are using the latest version.'); }, 900);
}
function initPWA(){ try { initPWA2(); } catch (e) { /* offline copy and install are extras: the app itself keeps working */ } }
function initPWA2(){
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.canInstall = e; if (state.ui.tab === 'settings') render(); });
  window.addEventListener('appinstalled', () => { PWA.canInstall = null; toast('BasicProfitStudio is installed'); if (state.ui.tab === 'settings') render(); });
  if (!swSupported) return;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (PWA.reloading) location.reload(); else { PWA.offlineReady = true; if (state.ui.tab === 'settings') render(); } });
  navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(reg => {
    PWA.reg = reg;
    if (navigator.serviceWorker.controller) PWA.offlineReady = true;
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - PWA.checked > 30 * 60 * 1000) checkForUpdates(false); });
    checkForUpdates(false);
  }).catch(() => { /* not available here: the app keeps working as a normal web page */ });
}
/* Settings card: install help, offline status, version */
function platformInfo(){
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const firefox = /Firefox|FxiOS/.test(ua);
  const safariMac = !ios && !android && /Safari/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR/.test(ua);
  return { ios, android, firefox, safariMac };
}
function installHelp(){
  const p = platformInfo(), out = [];
  if (isStandalone()){ out.push(h('p', null, 'You are using the installed app.')); return out; }
  if (PWA.canInstall){
    out.push(h('p', null, 'Your browser is ready to install BasicProfitStudio.'));
    out.push(h('div', { class: 'toolbar' }, h('button', { class: 'btn primary', type: 'button', onclick: async () => { const e = PWA.canInstall; PWA.canInstall = null; try { e.prompt(); await e.userChoice; } catch (x) { /* the browser decides */ } render(); } }, 'Install app')));
    return out;
  }
  if (location.protocol === 'file:'){
    out.push(h('p', { class: 'note-box' }, h('b', null, 'You opened this from a file on your computer.'), ' It works, but it cannot be installed as an app and it has no offline copy. The data in this copy is also separate from the data in the online version. To install it, open the app from its web address (the link in your Quick Start guide) in your browser.'));
    return out;
  }
  if (!swSupported){
    out.push(h('p', { class: 'note-box' }, h('b', null, 'Installing is not available on this address.'), ' Browsers only offer installation and offline use on a secure (https) web address. Open the app from the https link in your Quick Start guide.'));
    return out;
  }
  if (p.ios) out.push(h('p', null, h('b', null, 'iPhone or iPad: '), 'open this page in Safari, tap the Share button, choose “Add to Home Screen”, then tap Add. Other browsers on iPhone may offer the same in their Share menu, but Safari is the most reliable.'));
  else if (p.android) out.push(h('p', null, h('b', null, 'Android: '), 'open the browser menu (three dots) and choose “Install app” or “Add to Home screen”. Some browsers show an Install button here once they are ready.'));
  else if (p.firefox) out.push(h('p', null, h('b', null, 'Firefox on a computer '), 'cannot install web apps. You can keep using BasicProfitStudio in a browser tab, or open the link in Chrome or Edge if you want to install it.'));
  else if (p.safariMac) out.push(h('p', null, h('b', null, 'Safari on a Mac: '), 'choose File, then “Add to Dock”.'));
  else out.push(h('p', null, h('b', null, 'Chrome or Edge on a computer: '), 'look for the install icon at the right of the address bar, or open the browser menu and choose “Install BasicProfitStudio”.'));
  out.push(h('p', { class: 'sec' }, 'Not every browser or version shows an install button, and they do not all look the same. Installing is optional: the app works in a normal browser tab too.'));
  return out;

function aboutCard(){

  return h('div', { class: 'card about' }, h('h2', null, 'Use it like an app'), h('p', { class: 'sub' }, 'Optional. Install BasicProfitStudio on your phone or computer so it opens in its own window and works offline.'),

    h('dl', null, h('dt', null, 'Version'), h('dd', null, APP_VERSION_LABEL), h('dt', null, 'Offline copy'), h('dd', null, offline)),

}
